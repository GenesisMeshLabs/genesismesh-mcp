name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/snapshot_cli.py --check
      - run: python scripts/render_coverage.py --check
      - uses: actions/checkout@v4
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: 9e4d5c01e6ba7a22e73c17388796ec274f73a2fc
          path: temp/core
      - run: python scripts/check_coverage.py --core temp/core --require-http
      - run: python -m build
      - name: Install wheel and smoke from an isolated environment
        shell: bash
        run: |
          python -m venv temp/wheel-env
          if [ -f temp/wheel-env/Scripts/python.exe ]; then
            PYTHON=temp/wheel-env/Scripts/python.exe
          else
            PYTHON=temp/wheel-env/bin/python
          fi
          "$PYTHON" -m pip install -c requirements.lock dist/*.whl
          "$PYTHON" scripts/smoke_installed.py
