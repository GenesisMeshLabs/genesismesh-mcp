name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: python -m ruff check .
      - name: Run tests with branch coverage and source-bound execution evidence
        run: python -m coverage run -m pytest -q --evidence-report=temp/coverage/tests.json --junitxml=temp/coverage/junit.xml
      - run: python -m coverage json
      - run: python -m coverage report
      - run: python scripts/snapshot_cli.py --check
      - run: python scripts/render_coverage.py --check
      - name: Read the pinned core commit
        id: core
        shell: bash
        run: echo "commit=$(python -c 'import json; print(json.load(open("src/genesismesh_mcp/data/compatibility.json"))["core_commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ steps.core.outputs.commit }}
          path: temp/core
      - run: python scripts/check_coverage.py --core temp/core --require-http --require-no-gaps --test-evidence temp/coverage/tests.json --branch-coverage temp/coverage/branches.json --require-clean-evidence --require-full-behavior --json > temp/coverage/verification.json
      - run: python -m build
      - name: Install wheel and smoke from an isolated environment
        shell: bash
        run: |
          python -m venv temp/wheel-env
          if [ -f temp/wheel-env/Scripts/python.exe ]; then
            PYTHON=temp/wheel-env/Scripts/python.exe
          else
            PYTHON=temp/wheel-env/bin/python
          fi
          "$PYTHON" -m pip install -c requirements.lock dist/*.whl
          "$PYTHON" scripts/smoke_installed.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            temp/coverage/tests.json
            temp/coverage/branches.json
            temp/coverage/junit.xml
            temp/coverage/verification.json
          retention-days: 14
          if-no-files-found: ignore
  full-coverage:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements.lock ".[dev]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-*
          path: temp/matrix
      - name: Require complete supported-platform source and behavior coverage
        run: python scripts/check_full_coverage.py --inputs temp/matrix --output temp/coverage/full-coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: full-coverage-union
          path: temp/coverage/full-coverage.json
          retention-days: 14
          if-no-files-found: error
